name: CI/CD

on:
  workflow_dispatch:

  push:
    branches:
      - master

jobs:
  build-deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Maven build
        run: .\mvnw.cmd clean package

      - name: Docker build
        run: docker build -t localhost:5000/poc-kubernetes:${{ github.sha }} .

      - name: Docker push
        run: docker push localhost:5000/poc-kubernetes:${{ github.sha }}

      - name: Deploy DEV
        run: >
          helm upgrade --install poc-dev
          ./helm/poc-kubernetes
          -n poc-helm-dev
          -f ./helm/poc-kubernetes/values-dev.yaml
          --set app.image.tag=${{ github.sha }}
          --wait
          --timeout 2m
          --rollback-on-failure