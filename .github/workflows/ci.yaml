name: CI/CD

on:
  workflow_dispatch:

  push:
    branches:
      - master

jobs:

  build:
    runs-on: self-hosted

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Maven build
        run: .\mvnw.cmd clean package

      - name: Docker build
        run: docker build -t localhost:5000/poc-kubernetes:${{ github.sha }} .

      - name: Docker push
        run: docker push localhost:5000/poc-kubernetes:${{ github.sha }}


  deploy-dev:
    needs: build
    runs-on: self-hosted
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Deploy DEV
        run: >
          helm upgrade --install poc-dev
          ./helm/poc-kubernetes
          -n poc-helm-dev
          -f ./helm/poc-kubernetes/values-dev.yaml
          --set app.image.tag=${{ github.sha }}
          --wait
          --timeout 2m          
          --rollback-on-failure

  deploy-prod:
    needs: deploy-dev
    runs-on: self-hosted
    environment: prod

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Deploy PROD
        run: >
          helm upgrade --install poc-prod
          ./helm/poc-kubernetes
          -n poc-helm-prod
          -f ./helm/poc-kubernetes/values-prod.yaml
          --set app.image.tag=${{ github.sha }}
          --wait
          --timeout 2m
          --rollback-on-failure