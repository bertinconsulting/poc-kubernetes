app:
  replicaCount: 2

  image:
    repository: localhost:5000/poc-kubernetes
    tag: "4.0"
    pullPolicy: Always

  service:
    port: 8080

  resources:
    requests:
      memory: 256Mi
      cpu: 100m
    limits:
      memory: 512Mi
      cpu: 500m

postgres:
  image: postgres:17

  database: poc

  username: postgres
  password: postgres

  storage:
    size: 1Gi

ingress:
  enabled: true
  className: nginx
  host: poc.local

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 50

monitoring:
  enabled: false