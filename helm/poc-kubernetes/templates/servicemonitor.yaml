{{- if .Values.monitoring.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: poc-kubernetes
  labels:
    release: monitoring
spec:
  selector:
    matchLabels:
      app: poc-kubernetes

  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
  {{- end }}